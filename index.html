<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova de nivell</title>
</head>
<body>

    <header>
        <h1> Proba de nivell Albert Muntal Perez</h1>
    </header>

    <main>
        <section id="description">
            <p> A continuació veurem si tens sort. Introdueix un número de l'1 al 10 i jo et diré si t'ha tocat la loteria o has de tornar a intentar-ho.</p>
            <p>T'atreveixes a provar-ho?</p>
            <p>Introdueix un número, dona-li al botó i prova-ho!</p>
        </section>

        <form id="lottery_game">
            <input type = number placeholder = "Ingressa un nombre" id="user_input">
            <br><br>
            <button id = "play_lottery" type = "button"> JUGAR </button>
            <br><br>
            <button id = "see_attempts" type = "button"> VEURE INTENTS </button>
        </form>

        <br><br>
        
        <section id="results">
            <div id="response"> </div>
        </section>

    </main>

    <script src= "index.ts"> </script>
    
</body>
</html>
